<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440"
     font-family="ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,sans-serif">

  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5Z" fill="#64748b"/>
    </marker>
    <marker id="b" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5Z" fill="#3b82f6"/>
    </marker>
    <marker id="br" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto">
      <path d="M6,0.5 L0,3 L6,5.5Z" fill="#3b82f6"/>
    </marker>
    <marker id="p" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5Z" fill="#7c3aed"/>
    </marker>
    <marker id="or" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0.5 L6,3 L0,5.5Z" fill="#f97316"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="820" height="440" fill="#f8fafc" rx="8"/>

  <!-- ════════════════════════════════
       ACTORS  (row 1)
  ════════════════════════════════ -->

  <!-- Security Team pill  x=100..270  centre=185 -->
  <rect x="100" y="14" width="170" height="40" rx="20" fill="#0f172a"/>
  <text x="185" y="39" text-anchor="middle" font-size="13" font-weight="500" fill="white">👤 Security Team</text>

  <!-- MCP Clients pill  x=490..660  centre=575 -->
  <rect x="490" y="14" width="170" height="40" rx="20" fill="#4c1d95"/>
  <text x="575" y="39" text-anchor="middle" font-size="13" font-weight="500" fill="white">🤖 MCP Clients</text>

  <!-- ════════════════════════════════
       PLATFORM OUTER BOX  y=72..350
       x=80..680
  ════════════════════════════════ -->
  <rect x="80" y="72" width="600" height="278" rx="10"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="380" y="91" text-anchor="middle" font-size="9" font-weight="700"
        fill="#1d4ed8" letter-spacing="2.5">APPOLLO PLATFORM</text>

  <!-- Dashboard  x=95..400  y=100..213  (w=305 h=113) -->
  <rect x="95" y="100" width="305" height="113" rx="7" fill="#1d4ed8"/>
  <text x="247" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="white">Dashboard</text>
  <text x="247" y="147" text-anchor="middle" font-size="9" fill="#bfdbfe">Inventory · Findings · Port Scans · SSL</text>
  <text x="247" y="163" text-anchor="middle" font-size="9" fill="#93c5fd">Scheduling · User Management · Settings</text>
  <!-- MCP sub-bar  x=103..392  y=175..203 -->
  <rect x="103" y="175" width="289" height="28" rx="4" fill="#1e3a8a"/>
  <text x="247" y="194" text-anchor="middle" font-size="9" font-weight="500" fill="#93c5fd">MCP Server — /api/mcp/sse (API key auth)</text>

  <!-- MongoDB  x=415..670  y=100..213  (w=255 h=113) -->
  <rect x="415" y="100" width="255" height="113" rx="7" fill="#78350f"/>
  <text x="542" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="white">MongoDB</text>
  <text x="542" y="148" text-anchor="middle" font-size="9" fill="#fde68a">Scan results · Schedules</text>
  <text x="542" y="165" text-anchor="middle" font-size="9" fill="#fbbf24">API keys · Users · Settings</text>
  <text x="542" y="188" text-anchor="middle" font-size="9" fill="#d97706">database: Appollo</text>

  <!-- Scanner  x=95..670  y=228..340  (w=575 h=112) -->
  <rect x="95" y="228" width="575" height="112" rx="7" fill="#1e3a5f"/>
  <text x="382" y="254" text-anchor="middle" font-size="14" font-weight="600" fill="white">Appollo Scanner</text>
  <text x="382" y="275" text-anchor="middle" font-size="9" fill="#93c5fd">port scan · DAST · nuclei · subdomain · SSL · cert transparency · cloud storage</text>
  <text x="382" y="292" text-anchor="middle" font-size="9" fill="#60a5fa">wayback · technology · email security · vendor posture · dangling DNS · IP exposure</text>
  <!-- info sub-bar  x=103..662  y=303..329 -->
  <rect x="103" y="303" width="559" height="26" rx="4" fill="#172554"/>
  <text x="382" y="321" text-anchor="middle" font-size="8.5" fill="#7dd3fc">Runs on-demand via Dashboard or on a cron schedule · Writes all results to MongoDB</text>

  <!-- ════════════════════════════════
       EXTERNAL SERVICES  y=370..430
  ════════════════════════════════ -->

  <!-- Cloud APIs  x=80..265  centre=172 -->
  <rect x="80" y="370" width="185" height="60" rx="7" fill="#1e293b"/>
  <text x="172" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="white">Cloud APIs</text>
  <text x="172" y="411" text-anchor="middle" font-size="9" fill="#94a3b8">GCP · AWS · Cloudflare · GoDaddy</text>
  <text x="172" y="424" text-anchor="middle" font-size="8" fill="#475569">asset inventory</text>

  <!-- Open Source Tools  x=279..481  centre=380 -->
  <rect x="279" y="370" width="202" height="60" rx="7" fill="#1e293b"/>
  <text x="380" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="white">Open Source Tools</text>
  <text x="380" y="411" text-anchor="middle" font-size="9" fill="#94a3b8">naabu · nuclei · gau · tlsx</text>
  <text x="380" y="424" text-anchor="middle" font-size="8" fill="#475569">ffuf · subfinder · httpx</text>

  <!-- Alerts  x=495..680  centre=587 -->
  <rect x="495" y="370" width="185" height="60" rx="7" fill="#1e293b"/>
  <text x="587" y="393" text-anchor="middle" font-size="12" font-weight="600" fill="white">Alerts</text>
  <text x="587" y="411" text-anchor="middle" font-size="9" fill="#94a3b8">Jira tickets · Slack messages</text>
  <text x="587" y="424" text-anchor="middle" font-size="8" fill="#475569">medium+ severity</text>

  <!-- ════════════════════════════════
       ARROWS
  ════════════════════════════════ -->

  <!-- Security Team → Dashboard  (185,54)→(185,100) -->
  <line x1="185" y1="54" x2="185" y2="100"
        stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="198" y="78" font-size="8" fill="#64748b">HTTPS · OAuth</text>

  <!-- MCP Clients → MCP bar  (490,34)→(392,189) -->
  <line x1="490" y1="34" x2="392" y2="189"
        stroke="#7c3aed" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#p)"/>
  <text x="452" y="104" font-size="8" fill="#7c3aed">API key</text>

  <!-- Dashboard ↔ MongoDB  horizontal at y=150 -->
  <line x1="400" y1="150" x2="415" y2="150"
        stroke="#3b82f6" stroke-width="2"
        marker-start="url(#br)" marker-end="url(#b)"/>

  <!-- Dashboard → Scanner  (247,213)→(247,228)  triggers -->
  <line x1="247" y1="213" x2="247" y2="228"
        stroke="#3b82f6" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- Scanner writes → MongoDB  (490,228)→(490,213) -->
  <line x1="490" y1="228" x2="490" y2="213"
        stroke="#3b82f6" stroke-width="1.5" marker-end="url(#b)"/>

  <!-- Scanner → Cloud APIs  (172,340)→(172,370) -->
  <line x1="172" y1="340" x2="172" y2="370"
        stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- Scanner → Open Source Tools  (380,340)→(380,370) -->
  <line x1="380" y1="340" x2="380" y2="370"
        stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- Scanner → Alerts  (587,340)→(587,370) -->
  <line x1="587" y1="340" x2="587" y2="370"
        stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#a)"/>

  <!-- Alerts → Security Team  (right-margin routing above all elements) -->
  <path d="M680,400 L810,400 L810,8 L185,8 L185,14"
        stroke="#f97316" stroke-width="1.5" stroke-dasharray="5,3"
        fill="none" marker-end="url(#or)"/>
  <text x="740" y="210" font-size="8" fill="#f97316" transform="rotate(-90,740,210)">Jira · Slack alerts</text>

</svg>
